[package]
name = "common"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
# 序列化
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# 常用类型
uuid = { version = "1.23.1", features = ["serde", "v4"] }
chrono = { version = "0.4.44", features = ["serde"] }

# 错误处理
thiserror = "2.0.18"

# 安全
secrecy = { version = "0.10.3", features = ["serde"] }

# SigV4 签名（shared/src/sigv4.rs）
sha2 = "0.10"
hex = "0.4"

# Pipeline-as-code（.ops.yml 解析）
serde_yaml = "0.9"

[dev-dependencies]
tokio = { version = "1.52.1", features = ["full"] }
serial_test = "4.0.1"
